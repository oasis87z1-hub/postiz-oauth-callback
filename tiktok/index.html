<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; object-src 'none'">
  <title>TikTok-Anmeldung · Content-Zentrale</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #111214; color: #fafafa; }
    main { max-width: 31rem; margin: 2rem; padding: 2rem; border: 1px solid #35363a; border-radius: 1.25rem; }
    .brand { color: #b3b6c1; font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 2rem; letter-spacing: -.04em; margin: 1rem 0; }
    p { line-height: 1.6; color: #c9cbd2; }
    a { color: #c1b5ff; display: inline-block; margin-top: 1rem; }
    a[hidden] { display: none; }
  </style>
  <script src="./callback.js" defer></script>
</head>
<body>
  <main>
    <div class="brand">Content-Zentrale</div>
    <h1>TikTok-Anmeldung</h1>
    <p id="status" role="status">Bereit für die Rückleitung zu deinem lokalen Postiz. Starte die Kontoverknüpfung dort auf diesem Mac.</p>
    <a id="continue" hidden rel="noreferrer">Weiter zu Postiz</a>
    <noscript><p>Bitte aktiviere JavaScript, um die Anmeldung in Postiz abzuschließen.</p></noscript>
  </main>
</body>
</html>
